name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore LocustInjector/LocustInjector.csproj

      - name: Build
        run: dotnet build LocustInjector/LocustInjector.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish LocustInjector/LocustInjector.csproj --configuration Release --no-restore --output ./publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocustInjector-build-${{ github.sha }}
          path: ./publish
